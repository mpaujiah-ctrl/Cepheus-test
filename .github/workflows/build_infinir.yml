name: Kernel InfiniR A13

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Clone kernel source
        run: git clone --depth=1 -b 13.0 https://github.com/mpaujiah-ctrl/kernel_xiaomi_cepheus kernel
     
      - name: Install toolchain (clang + GNU cross-compiler)
        run: |
          sudo apt update
          sudo apt install -y clang lld llvm bc bison flex libssl-dev libelf-dev build-essential
          sudo apt install -y gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Clone SUSFS (v2.1.0, source langsung dari raystef66 kernel tree)
        run: |
          mkdir -p susfs/kernel_patches/fs susfs/kernel_patches/include/linux
          curl -sL "https://raw.githubusercontent.com/raystef66/kernel_xiaomi_cepheus/16.0-ksun/fs/susfs.c" -o susfs/kernel_patches/fs/susfs.c
          curl -sL "https://raw.githubusercontent.com/raystef66/kernel_xiaomi_cepheus/16.0-ksun/include/linux/susfs.h" -o susfs/kernel_patches/include/linux/susfs.h
          curl -sL "https://raw.githubusercontent.com/raystef66/kernel_xiaomi_cepheus/16.0-ksun/include/linux/susfs_def.h" -o susfs/kernel_patches/include/linux/susfs_def.h
          echo "=== Verifikasi versi ==="
          grep "SUSFS_VERSION" susfs/kernel_patches/include/linux/susfs.h
          echo "=== Verifikasi 3 file ada ==="
          ls -la susfs/kernel_patches/fs/susfs.c susfs/kernel_patches/include/linux/susfs.h susfs/kernel_patches/include/linux/susfs_def.h

      - name: Patch KernelSU Next (v3.2.0-legacy + susfs v2, dari fork rifsxd)
        run: |
          cd kernel
          curl -sL "https://github.com/rifsxd/KernelSU-Next/archive/00cb93e0bc8bf3ca3680c7e8a3d7cf11d0b59071.tar.gz" -o ksun.tar.gz
          mkdir -p ksun_src
          tar -xzf ksun.tar.gz -C ksun_src --strip-components=1
          rm ksun.tar.gz

          echo "=== Verifikasi extract ==="
          ls ksun_src/kernel/

          # PENTING: hapus dulu kernelsu bawaan Spark kernel sebelum symlink,
          # kalau enggak ln -sf bakal nyimpen symlink DI DALAM folder lama (bukan ganti)
          rm -rf drivers/staging/kernelsu

          # Symlink manual (replikasi setup.sh, tapi arahin ke fork rifsxd)
          ln -sf "$(realpath --relative-to=drivers/staging ksun_src/kernel)" drivers/staging/kernelsu
          grep -q "kernelsu" drivers/staging/Makefile || printf "\nobj-\$(CONFIG_KSU) += kernelsu/\n" >> drivers/staging/Makefile
          grep -q "drivers/kernelsu/Kconfig" drivers/staging/Kconfig || sed -i '/endmenu/i\source "drivers/kernelsu/Kconfig"' drivers/staging/Kconfig

          echo "=== Verifikasi symlink ==="
          ls -la drivers/staging/kernelsu
          ls drivers/staging/kernelsu/core/

          # Fix KSU_VERSION: karena pakai tarball (bukan git clone), Kbuild gak bisa
          # detect commit count lewat git rev-list, jadi fallback ke nilai 1.
          # Patch Kbuild buat hardcode versi yang match sama manager APK (33129)
          sed -i 's/KSU_VERSION_FALLBACK := 1/KSU_VERSION_FALLBACK := 33129/' ksun_src/kernel/Kbuild
          echo "=== Verifikasi KSU_VERSION fix ==="
          grep "KSU_VERSION_FALLBACK" ksun_src/kernel/Kbuild

          # Stub path_umount untuk kernel 4.14
          echo 'int path_umount(struct path *path, int flags) { return 0; }' >> fs/namespace.c

          cd ..

      - name: Grep KernelSU Hooks
        run: |
          cd kernel
          echo "=== Cari ksu_handle_vfs_read ==="
          grep -R "ksu_handle_vfs_read" -n drivers/staging/kernelsu core fs drivers/input || true
      
          echo "=== Cari ksu_input_hook ==="
          grep -R "ksu_input_hook" -n drivers/staging/kernelsu core fs drivers/input || true
      
          echo "=== Cari semua ksu_* ==="
          grep -R "ksu_" -n drivers/staging/kernelsu core fs drivers/input || true
     
      - name: Inject manual hook ke kernel/reboot.c (required by KSUN 3.2.0 Kbuild check)
        run: |
          cd kernel
          # KSUN 3.2.0 Kbuild cek keberadaan "ksu_handle_sys_reboot" di kernel/reboot.c
          # sebagai validasi bahwa manual hook mode sudah diintegrasikan
          if ! grep -q "ksu_handle_sys_reboot" kernel/reboot.c; then
            # tambah deklarasi extern sebelum SYSCALL_DEFINE4(reboot, ...)
            sed -i '/^SYSCALL_DEFINE4(reboot/i extern int ksu_handle_sys_reboot(int magic1, int magic2, unsigned int cmd, void __user **arg4);' kernel/reboot.c
            # inject call di dalam syscall setelah magic check
            sed -i '/if (magic1 != LINUX_REBOOT_MAGIC1/i \\tksu_handle_sys_reboot(magic1, magic2, cmd, (void __user **)&arg);' kernel/reboot.c
            echo "=== Hook injected ==="
            grep -n "ksu_handle_sys_reboot" kernel/reboot.c
          else
            echo "=== Hook sudah ada ==="
          fi
          cd ..

      - name: Copy SUSFS Files (v2.1.0)
        run: |
          cd kernel
          cp ../susfs/kernel_patches/fs/susfs.c fs/
          cp ../susfs/kernel_patches/include/linux/susfs.h include/linux/
          cp ../susfs/kernel_patches/include/linux/susfs_def.h include/linux/
          echo "=== Verifikasi ==="
          ls -la include/linux/susfs.h fs/susfs.c include/linux/susfs_def.h
          grep "SUSFS_VERSION" include/linux/susfs.h

          # PENTING: wire susfs.o ke fs/Makefile, kalau enggak susfs.c gak ikut dikompilasi
          # walaupun filenya ada, jadi semua symbol susfs_* bakal "undefined" pas linking
          grep -q "susfs.o" fs/Makefile || echo 'obj-$(CONFIG_KSU_SUSFS) += susfs.o' >> fs/Makefile
          echo "=== Verifikasi Makefile ==="
          grep "susfs" fs/Makefile

      - name: Setup defconfig KSUN
        run: |
          echo "CONFIG_KSU=y" >> kernel/arch/arm64/configs/cepheus_defconfig
          echo "CONFIG_KPROBES=y" >> kernel/arch/arm64/configs/cepheus_defconfig
          echo "CONFIG_HAVE_KPROBES=y" >> kernel/arch/arm64/configs/cepheus_defconfig
          echo "CONFIG_KALLSYMS=y" >> kernel/arch/arm64/configs/cepheus_defconfig
          echo "CONFIG_UTS_NS=y" >> kernel/arch/arm64/configs/cepheus_defconfig
          echo "CONFIG_IPC_NS=y" >> kernel/arch/arm64/configs/cepheus_defconfig
          echo "CONFIG_USER_NS=y" >> kernel/arch/arm64/configs/cepheus_defconfig
          echo "CONFIG_PID_NS=y" >> kernel/arch/arm64/configs/cepheus_defconfig
          echo "CONFIG_NET_NS=y" >> kernel/arch/arm64/configs/cepheus_defconfig
          echo "CONFIG_MODULES=y" >> kernel/arch/arm64/configs/cepheus_defconfig
          echo "CONFIG_LTO_NONE=y" >> kernel/arch/arm64/configs/cepheus_defconfig
          echo "CONFIG_NR_CPUS=8" >> kernel/arch/arm64/configs/cepheus_defconfig
          echo "CONFIG_NO_HZ_FULL=n" >> kernel/arch/arm64/configs/cepheus_defconfig
          echo "CONFIG_NO_HZ_IDLE=y" >> kernel/arch/arm64/configs/cepheus_defconfig
          echo "CONFIG_SCHED_BOOST=n" >> kernel/arch/arm64/configs/cepheus_defconfig
          echo "CONFIG_QCOM_PERF_BOOST=n" >> kernel/arch/arm64/configs/cepheus_defconfig
          echo "CONFIG_QTI_SCMI_PLAT=n" >> kernel/arch/arm64/configs/cepheus_defconfig
          echo "CONFIG_WALT=n" >> kernel/arch/arm64/configs/cepheus_defconfig
          echo "CONFIG_SCHED_DEBUG=y" >> kernel/arch/arm64/configs/cepheus_defconfig
          echo "CONFIG_MSM_GENI_IR=n" >> kernel/arch/arm64/configs/cepheus_defconfig
          echo "CONFIG_KSU_SUSFS=y" >> kernel/arch/arm64/configs/cepheus_defconfig
          echo "CONFIG_KSU_SUSFS_SUS_PATH=y" >> kernel/arch/arm64/configs/cepheus_defconfig
          echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y" >> kernel/arch/arm64/configs/cepheus_defconfig
          echo "CONFIG_KSU_SUSFS_SUS_KSTAT=y" >> kernel/arch/arm64/configs/cepheus_defconfig
          echo "CONFIG_KSU_SUSFS_TRY_UMOUNT=y" >> kernel/arch/arm64/configs/cepheus_defconfig
          echo "CONFIG_KSU_SUSFS_SPOOF_UNAME=y" >> kernel/arch/arm64/configs/cepheus_defconfig
          echo "CONFIG_KSU_SUSFS_ENABLE_LOG=y" >> kernel/arch/arm64/configs/cepheus_defconfig
          echo "CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y" >> kernel/arch/arm64/configs/cepheus_defconfig
          echo "CONFIG_KSU_MANUAL_HOOK=y" >> kernel/arch/arm64/configs/cepheus_defconfig
          echo "CONFIG_KSU_KPROBES_HOOK=n" >> kernel/arch/arm64/configs/cepheus_defconfig
          echo "CONFIG_KSU_SUSFS_OPEN_REDIRECT=y" >> kernel/arch/arm64/configs/cepheus_defconfig
          echo "CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y" >> kernel/arch/arm64/configs/cepheus_defconfig
          echo "CONFIG_KSU_SUSFS_SUS_MAP=y" >> kernel/arch/arm64/configs/cepheus_defconfig
          echo 'CONFIG_LOCALVERSION="-TURTLE-SUSFS-v2"' >> kernel/arch/arm64/configs/cepheus_defconfig
      
      - name: Fix yamltree.c (stub kosong, solusi dari TURTLE)
        run: |
          cd kernel
          cat > scripts/dtc/yamltree.c << 'CEOF'
          #include <stdio.h>
          #include <stdlib.h>
          
          struct dt_info;
          
          void dt_to_yaml(FILE *outf, struct dt_info *dti) {}
          CEOF
          echo "yamltree.c replaced with stub"
                             
      - name: Enable F2FS optimization di defconfig
        run: |
          cd kernel
          cat >> arch/arm64/configs/cepheus_defconfig << 'EOF'
          CONFIG_F2FS_FS=y
          CONFIG_F2FS_FS_XATTR=y
          CONFIG_F2FS_FS_POSIX_ACL=y
          CONFIG_F2FS_FS_ENCRYPTION=y
          CONFIG_F2FS_FS_SECURITY=y
          CONFIG_F2FS_FS_COMPRESSION=y
          CONFIG_F2FS_CHECK_FS=y
          EOF
          echo "=== F2FS options added ==="
          grep "CONFIG_F2FS" arch/arm64/configs/cepheus_defconfig
      
      - name: Build kernel (pakai flag dari build.sh asli raystef66)
        run: |
          cd kernel
          export ARCH=arm64
          export LLVM=1
          export CC=clang
          export AR=llvm-ar
          export LD=ld.lld
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export OBJDUMP=llvm-objdump
          export STRIP=llvm-strip
          export CROSS_COMPILE=aarch64-linux-gnu-
          export USE_CCACHE=1

          make O=out ARCH=arm64 cepheus_defconfig

          make ARCH=arm64 \
               O=out \
               CC=clang \
               AR=llvm-ar \
               LD=ld.lld \
               NM=llvm-nm \
               OBJCOPY=llvm-objcopy \
               OBJDUMP=llvm-objdump \
               STRIP=llvm-strip \
               -j$(nproc --all) Image.gz-dtb

          echo "=== Verify Image.gz-dtb ==="
          ls out/arch/arm64/boot/Image.gz-dtb

      - name: Clone AnyKernel3
        run: |
            git clone --depth=1 https://github.com/osm0sis/AnyKernel3
            echo "=== Ganti anykernel.sh & ak3-core.sh ==="
            cp anykernel.sh AnyKernel3/anykernel.sh
            cp ak3-core.sh AnyKernel3/tools/ak3-core.sh
            cat AnyKernel3/anykernel.sh      
      
      - name: Pack AnyKernel3
        run: |
          cp kernel/out/arch/arm64/boot/Image.gz-dtb AnyKernel3/          
          cd AnyKernel3 && zip -r9 ../InfiniR.zip * -x README

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: InfiniR-polos
          path: |
            InfiniR.zip           
